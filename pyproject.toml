[project]
name = "membridge"
version = "0.2.0"
description = "MemBridge: Standardized C/S evaluation middleware for AI Agent long-term memory systems."
requires-python = ">=3.11"
dependencies = [
    "ijson>=3.5.0",
    "openai>=2.38.0",
    "pydantic>=2.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.2",
    "rich>=15.0.0",
    "tiktoken>=0.13.0",
]

[project.scripts]
membridge = "memory_benchmark.__main__:main"
memory-benchmark = "memory_benchmark.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["memory_benchmark*"]
exclude = ["benchmarks*", "docs*", "models*", "tests*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not api'"
markers = [
    "unit: 纯逻辑与实体契约测试",
    "integration: 适配器、存储与端到端流水线测试",
    "api: 会调用真实外部 LLM API 的测试",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
